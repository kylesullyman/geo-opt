[project]
name = "geo"
version = "0.1.0"
description = "AI search visibility audits for local businesses: crawl/schema/content checks, citation sampling, fixes, reports."
authors = [
    { name = "h0low_", email = "145087871+kylesullyman@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "extruct>=0.18.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.12",
    "trafilatura>=2.2.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
js = ["playwright>=1.47"]

[project.scripts]
geo = "geo.cli:run"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
